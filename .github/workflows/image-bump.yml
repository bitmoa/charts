name: '[CI/CD] Container Image Bump'
# Entry point for bitmoa/containers: once a container image has been built,
# pushed and signed, that repository dispatches here. Every chart referencing
# the image gets its tag bumped, is installed on a throwaway k3s cluster and is
# only committed to main once the workloads are verified healthy. The commit on
# main then triggers '[CI/CD] CD Pipeline', which packages and publishes it.
on:
  repository_dispatch:
    types: [container-image-published]
  workflow_dispatch:
    inputs:
      image:
        description: 'Container image name, e.g. argo-workflow-controller'
        required: true
        type: string
      tag:
        description: 'Full image tag, e.g. 3.7.2-debian-12-r0'
        required: true
        type: string
      charts:
        description: 'Space separated chart names (optional, auto-detected when empty)'
        required: false
        type: string
      dry_run:
        description: 'Verify only, do not commit'
        required: false
        default: false
        type: boolean

permissions: {}

# One run per image; a newer image supersedes an in-flight older one.
concurrency:
  group: image-bump-${{ github.event.client_payload.image || inputs.image }}
  cancel-in-progress: false

env:
  IMAGE: ${{ github.event.client_payload.image || inputs.image }}
  IMAGE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
  SOURCE_TAG: ${{ github.event.client_payload.source_tag || '' }}
  DRY_RUN: ${{ inputs.dry_run || false }}

jobs:
  resolve:
    name: 'Resolve affected charts'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.repository_owner == 'bitmoa' }}
    outputs:
      charts: ${{ steps.resolve.outputs.charts }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - id: validate
        name: 'Validate inputs'
        run: |
          set -euo pipefail
          [[ -n "${IMAGE}" ]]     || { echo "::error::missing image name"; exit 1; }
          [[ -n "${IMAGE_TAG}" ]] || { echo "::error::missing image tag"; exit 1; }
          # Reject anything that is not a plain image name / tag before it reaches a shell.
          grep -qE '^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$' <<< "${IMAGE}" \
            || { echo "::error::invalid image name '${IMAGE}'"; exit 1; }
          grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]*$' <<< "${IMAGE_TAG}" \
            || { echo "::error::invalid image tag '${IMAGE_TAG}'"; exit 1; }
      - id: resolve
        name: 'Find charts referencing the image'
        env:
          REQUESTED_CHARTS: ${{ inputs.charts }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/*.sh

          if [[ -n "${REQUESTED_CHARTS}" ]]; then
            read -ra charts <<< "${REQUESTED_CHARTS}"
            for c in "${charts[@]}"; do
              [[ -d "bitmoa/${c}" ]] || { echo "::error::chart '${c}' does not exist"; exit 1; }
            done
          else
            mapfile -t charts < <(./.github/scripts/find-charts-for-image.sh "${IMAGE}")
          fi

          echo "Charts affected by ghcr.io/bitmoa/${IMAGE}:${IMAGE_TAG}: ${charts[*]:-<none>}"
          {
            echo "count=${#charts[@]}"
            echo "charts=$(printf '%s\n' "${charts[@]:-}" | grep -v '^$' | jq -R . | jq -sc .)"
          } >> "$GITHUB_OUTPUT"
      - name: 'Report when no chart uses the image'
        if: ${{ steps.resolve.outputs.count == '0' }}
        run: |
          echo "### No chart references \`ghcr.io/bitmoa/${IMAGE}\` - nothing to do" >> "$GITHUB_STEP_SUMMARY"

  bump-verify-commit:
    name: 'Bump, verify & commit (${{ matrix.chart }})'
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ needs.resolve.outputs.count != '0' }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      # Serialised on purpose: the CD Pipeline expects exactly one chart to
      # change per commit on main, and it keeps the pushes free of races.
      max-parallel: 1
      matrix:
        chart: ${{ fromJSON(needs.resolve.outputs.charts) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: main
          fetch-depth: 0

      - name: 'Install helm, yq and kubectl'
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - id: bump
        name: 'Bump image tag and chart version'
        env:
          CHART: ${{ matrix.chart }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/*.sh
          ./.github/scripts/bump-image-tag.sh "${CHART}" "${IMAGE}" "${IMAGE_TAG}"

      - name: 'Show diff'
        if: ${{ steps.bump.outputs.changed == 'true' }}
        run: git --no-pager diff -- "bitmoa/${{ matrix.chart }}"

      - name: 'Set up k3s'
        if: ${{ steps.bump.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          curl -sfL https://get.k3s.io | \
            INSTALL_K3S_VERSION="${K3S_VERSION}" \
            INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable traefik --disable metrics-server" \
            sh -s -
          mkdir -p "$HOME/.kube"
          sudo cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
          sudo chown "$USER" "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
          kubectl wait --for=condition=Ready node --all --timeout=180s
          kubectl get nodes -o wide
        env:
          K3S_VERSION: v1.31.5+k3s1

      - name: 'Create GHCR pull secret'
        if: ${{ steps.bump.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          kubectl create namespace chart-verify --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-creds \
            --namespace chart-verify \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 'Verify the image tag is actually pullable'
        if: ${{ steps.bump.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker manifest inspect "ghcr.io/bitmoa/${IMAGE}:${IMAGE_TAG}" > /dev/null
          echo "ghcr.io/bitmoa/${IMAGE}:${IMAGE_TAG} exists"

      - name: 'Install chart on k3s and verify pods'
        if: ${{ steps.bump.outputs.changed == 'true' }}
        env:
          NAMESPACE: chart-verify
          PULL_SECRET_NAME: ghcr-creds
          WAIT_TIMEOUT: 900s
        run: ./.github/scripts/verify-chart-install.sh "${{ matrix.chart }}"

      - name: 'Update CHANGELOG.md'
        if: ${{ steps.bump.outputs.changed == 'true' && env.DRY_RUN != 'true' }}
        env:
          CHART: ${{ matrix.chart }}
          CHART_VERSION: ${{ steps.bump.outputs.chart_version }}
          OLD_TAG: ${{ steps.bump.outputs.old_tag }}
        run: |
          set -euo pipefail
          changelog="bitmoa/${CHART}/CHANGELOG.md"
          entry="* Bump \`${IMAGE}\` image to \`${IMAGE_TAG}\` (was \`${OLD_TAG}\`)"
          if [[ -f "$changelog" ]]; then
            body="$(tail -n +2 "$changelog")"
          else
            body=""
          fi
          {
            printf '# Changelog\n\n## %s (%s)\n\n%s\n' \
              "${CHART_VERSION}" "$(date +'%Y-%m-%d')" "${entry}"
            printf '%s\n' "$body"
          } > "$changelog"

      # App tokens live for one hour and the k3s verification above can take a
      # good part of that, so mint a fresh one rather than reuse the checkout's.
      - name: Refresh token for push
        id: push-token
        if: ${{ steps.bump.outputs.changed == 'true' && env.DRY_RUN != 'true' }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.SYNC_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_BOT_PRIVATE_KEY }}

      - name: 'Commit and push'
        if: ${{ steps.bump.outputs.changed == 'true' && env.DRY_RUN != 'true' }}
        env:
          CHART: ${{ matrix.chart }}
          CHART_VERSION: ${{ steps.bump.outputs.chart_version }}
          OLD_TAG: ${{ steps.bump.outputs.old_tag }}
          GH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          set -euo pipefail
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name  "bitmoa-sync[bot]"
          git config user.email "bitmoa-sync@bitmoa.net"
          git add "bitmoa/${CHART}"
          if git diff --cached --quiet; then
            echo "Nothing staged, skipping commit."
            exit 0
          fi
          git commit --signoff -m "[bitmoa/${CHART}] Release ${CHART_VERSION} (${IMAGE} ${IMAGE_TAG})" \
            -m "Bump ${IMAGE} from ${OLD_TAG} to ${IMAGE_TAG}.
          Verified on k3s: chart installs and all pods reach Ready with 0 restarts.
          ${SOURCE_TAG:+Triggered by bitmoa/containers tag ${SOURCE_TAG}.}"

          # main moves under us whenever another chart in this matrix lands first.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected, rebasing onto origin/main (attempt ${attempt})"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 5 attempts"
          exit 1

      - name: 'Summary'
        if: ${{ always() }}
        env:
          CHART: ${{ matrix.chart }}
        run: |
          {
            echo "### ${CHART}"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| image | \`ghcr.io/bitmoa/${IMAGE}:${IMAGE_TAG}\` |"
            echo "| previous tag | \`${{ steps.bump.outputs.old_tag || 'n/a' }}\` |"
            echo "| chart version | \`${{ steps.bump.outputs.chart_version || 'n/a' }}\` |"
            echo "| appVersion | \`${{ steps.bump.outputs.app_version || 'n/a' }}\` |"
            echo "| changed | ${{ steps.bump.outputs.changed || 'false' }} |"
            echo "| dry run | ${DRY_RUN} |"
            echo "| result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
